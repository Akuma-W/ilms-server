services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: test-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - test-network
  
  redis:
    image: redis:latest
    container_name: test-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - test-network
    
volumes:
  pgdata:
  redis_data:

networks:
  test-network:
    driver: bridge
    external: true
