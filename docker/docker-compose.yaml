name: ilms-server

services:
  ilms-server:
    container_name: ilms-server
    image: ilms-server:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ilms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_ENDPOINT: minio
      MINIO_PORT: 9000
      LOKI_HOST: http://loki:3100
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.ilms.loadbalancer.server.port=${PORT:-5000}'
      - 'traefik.http.routers.ilms.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api/v1`)'
      - 'traefik.http.routers.ilms.entryPoints=web,websecure'
      - 'traefik.http.routers.ilms.priority=100'
      - 'traefik.http.routers.ilms.tls=true'
      - 'traefik.http.routers.ilms.tls.certresolver=letsencrypt'
    ports:
      - '${PORT:-5000}:${PORT:-5000}'
    networks:
      - ilms-network

networks:
  ilms-network:
    name: ilms-network
    external: true
