name: ilms-server

services:
  ilms-server:
    container_name: ilms-server
    image: ilmsserver
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.ilms.loadbalancer.server.port=5000'
      - 'traefik.http.routers.ilms.rule=Host(`ilms.gzrcloud.com`)'
      - 'traefik.http.routers.ilms.entryPoints=web,websecure'
    # ports:
    #   - 5000:5000
    networks:
      - ilms-network

networks:
  ilms-network:
    driver: bridge
    external: true
