name: ilms-server

services:
  ilms-server:
    container_name: ilms-server
    image: ilmsserver
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.ilms.loadbalancer.server.port=3000'
      - 'traefik.http.routers.ilms.rule=Host(`ilms.gzrcloud.com`) && PathPrefix(`/api/v1`)'
      - 'traefik.http.routers.ilms.entryPoints=websecure'
      - 'traefik.http.routers.ilms.priority=100'
      - 'traefik.http.routers.ilms.tls=true'
      - 'traefik.http.routers.ilms.tls.certresolver=letsencrypt'

      - 'traefik.http.routers.ilms-http.rule=Host(`ilms.gzrcloud.com`) && PathPrefix(`/api/v1`)'
      - 'traefik.http.routers.ilms-http.entrypoints=web'
      - 'traefik.http.routers.ilms-http.middlewares=https-redirect'
      - 'traefik.http.middlewares.https-redirect.redirectscheme.scheme=https'
    ports:
      - 5000:5000
    networks:
      - ilms-network

networks:
  ilms-network:
    driver: bridge
    external: true
