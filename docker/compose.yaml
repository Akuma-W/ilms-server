name: test-server

services:
  testserver:
    container_name: test-server
    image: testserver
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.production.local
    ports:
      - 5000:5000
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
    external: true
