name: ilms-server

services:
  ilms-server:
    container_name: ilms-server
    image: ilmsserver
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - 5000:5000
    networks:
      - ilms-network

networks:
  ilms-network:
    driver: bridge
    external: true
