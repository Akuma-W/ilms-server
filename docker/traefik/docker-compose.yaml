services:
  traefik:
    image: traefik:v3.6.7
    container_name: traefik
    # environment:
    #   - TZ=Asia/Ho_Chi_Minh
    command:
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 80
        protocol: tcp
        mode: host
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
    volumes:
      - '/run/user/1001/docker.sock:/var/run/docker.sock:ro'
      - './traefik.yml:/etc/traefik/traefik.yml'
      - './conf.d:/etc/traefik/conf.d'
      - './plugins:/plugins-local'
      - './data:/data'
    networks:
      - ilms-network

