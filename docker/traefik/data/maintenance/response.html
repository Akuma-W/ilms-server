    <title>Maintenance Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        p {
          margin: 0;
          padding: 0;
        }
        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container {
            max-width: 45%;
        }
        .text-container {
            max-width: 55%;
            padding-left: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
        }

        .text-content {
          font-size: 25px;
          color: gray;
        }

        .title-content {
          font-size: 35px;
          color: #464242;
        }

        @media (max-width: 768px) {
            .image-container {
              max-width: fit-content;
            }
            .text-container {
              max-width: fit-content;
            }
            .row {
                flex-direction: column;
            }
            .text-container {
                padding-left: 0;
                text-align: center;
            }
            .title-content {
              font-size: 22px;
            }
            .text-content {
              font-size: 18px;
            }
        }
    </style>
