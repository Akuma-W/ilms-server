global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  insecure: true
  dashboard: true
  debug: true

log:
  level: INFO

ping:
  entryPoint: traefik

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: ilms-network
    watch: true

  file:
    directory: /etc/traefik/conf.d
    watch: true

entryPoints:
  traefik:
    address: :9000
  web:
    address: :80
    forwardedHeaders:
      insecure: true
    transport:
      respondingTimeouts:
        readTimeout: 5m
        writeTimeout: 0s
        idleTimeout: 180s
  websecure:
    address: :443
    forwardedHeaders:
      insecure: true
    transport:
      respondingTimeouts:
        readTimeout: 5m
        writeTimeout: 0s
        idleTimeout: 180s

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: desec
        delayBeforeCheck: 60s

accessLog:
  filePath: /data/access.log
  fields:
    names:
      StartUTC: drop
    headers:
      defaultMode: keep
      names:
        'Accept': keep
        'Authorization': drop
        'Content-Type': keep
        'User-Agent': keep
        'Referer': keep
