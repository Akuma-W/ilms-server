http:
  middlewares:
    traefik-dashboard:
      plugin:
        traefik-dashboard:
          dashboardPath: "plugins/dashboard"
          allowedHost: "monitor.localtest.me"
          enableDocker: true
          username: admin
          password:

    limit:
      plugin:
        traefik-limit:
          enabled: true
          filename: '/data/limit/response.json'
          httpResponseCode: 429
          httpContentType: 'application/json; charset=utf-8'
          limitUrl: "/sleep"
          limitCount: 50

    lady-app:
      plugin:
        traefik-maintenance:
          enabled: true
          filename: '/data/maintenance/response-lady.json'
          triggerFilename: '/data/maintenance/lady-app.trigger'
          httpResponseCode: 504
          httpContentType: 'application/json; charset=utf-8'
          dailySchedules:
          - start: "00:00"
            end: "15:00"
          - start: "15:41"
            end: "15:00"
          denyUri:
          - "/mobile/"
          - "/leader/"
