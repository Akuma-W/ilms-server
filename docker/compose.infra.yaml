name: test-infra

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: test-postgres
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      POSTGRES_USER: runsystem
      POSTGRES_PASSWORD: 1234@Dcba
      POSTGRES_DB: test_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - test-network
  
  redis:
    image: redis:8.6
    container_name: test-redis
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    command: >
      redis-server
      --requirepass 1234@Dcba
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - test-network

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - 9000
    volumes:
      - ./volumes/.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - test-network
    
volumes:
  pgdata:
  redis_data:

networks:
  test-network:
    driver: bridge
    external: true
