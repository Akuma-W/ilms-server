name: ilms-infra

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ilms-postgres
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      POSTGRES_USER: runsystem
      POSTGRES_PASSWORD: 1234@Dcba
      POSTGRES_DB: ilms_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - ilms-network
  
  redis:
    image: redis:8.6
    container_name: ilms-redis
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    command: >
      redis-server
      --requirepass 1234@Dcba
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ilms-network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=runsystem
      - MINIO_ROOT_PASSWORD=1234@Dcba
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - ilms-network
    
volumes:
  pgdata:
  redis_data:

networks:
  ilms-network:
    driver: bridge
    external: true
