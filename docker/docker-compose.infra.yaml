name: ilms-infra

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ilms-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: runsystem
      POSTGRES_PASSWORD: 1234@Dcba
      POSTGRES_DB: ilms_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    networks:
      - ilms-network

  redis:
    image: redis:8.6
    container_name: ilms-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: >
      redis-server
      --requirepass 1234@Dcba
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ilms-network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=runsystem
      - MINIO_ROOT_PASSWORD=1234@Dcba
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - '9090:9000'
      - '9001:9001'
    expose:
      - '9000'
      - '9001'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.minio.rule=Host(`files.ilms.gzrcloud.com`)'
      - 'traefik.http.services.minio.loadbalancer.server.port=9000'
      - 'traefik.http.services.minio.entrypoints=websecure'
      - 'traefik.http.services.minio.tls=true'
      - 'traefik.http.routers.minio.tls.certresolver=letsencrypt'

      - 'traefik.http.routers.minio-console.rule=Host(`minio-console.localhost`)'
      - 'traefik.http.services.minio-console.loadbalancer.server.port=9001'
      - 'traefik.http.services.minio-console.entrypoints=websecure'
      - 'traefik.http.services.minio-console.tls=true'
      - 'traefik.http.routers.minio-console.tls.certresolver=letsencrypt'
    volumes:
      - ./volumes/data/minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - ilms-network

volumes:
  pgdata:
  redis_data:

networks:
  ilms-network:
    driver: bridge
    external: true
