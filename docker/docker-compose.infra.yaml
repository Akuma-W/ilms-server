name: ilms-infra

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ilms-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - ilms-network

  redis:
    image: redis:8.6
    container_name: ilms-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - ilms-network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_UPDATE: "off"
    ports:
      - '${MINIO_PORT:-9090}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    expose:
      - '9000'
      - '9001'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.minio.rule=Host(`${MINIO_DOMAIN:-files.localhost}`)'
      - 'traefik.http.services.minio.loadbalancer.server.port=9000'
      - 'traefik.http.services.minio.entrypoints=websecure'
      - 'traefik.http.services.minio.tls=true'
      - 'traefik.http.routers.minio.tls.certresolver=letsencrypt'

      - 'traefik.http.routers.minio-console.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/minio/`)'
      - 'traefik.http.services.minio-console.loadbalancer.server.port=9001'
      - 'traefik.http.services.minio-console.entrypoints=websecure'
      - 'traefik.http.services.minio-console.tls=true'
      - 'traefik.http.routers.minio-console.tls.certresolver=letsencrypt'
    volumes:
      - ./volumes/data/minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - ilms-network

volumes:
  pgdata:
  redis_data:

networks:
  ilms-network:
    name: ilms-network
    driver: bridge
