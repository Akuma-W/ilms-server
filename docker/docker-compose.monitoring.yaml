name: ilms-monitor

services:
  loki:
    image: grafana/loki:3.4.2
    container_name: ilms-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    ports:
      - '3100:3100'
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ilms-network:
        aliases:
          - loki

  grafana:
    image: grafana/grafana:11.5.2
    container_name: ilms-grafana
    restart: unless-stopped
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANONYMOUS_ROLE:-Admin}
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3030}:3000'
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilms-network

volumes:
  loki_data:
  grafana_data:

networks:
  ilms-network:
    name: ilms-network
    external: true
